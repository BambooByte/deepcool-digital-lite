name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release package
        run: powershell -ExecutionPolicy Bypass -File .\scripts\Build-Release.ps1

      - name: Create archive
        shell: powershell
        run: |
          $archive = "deepcool-digital-lite-windows-x64.zip"
          Compress-Archive -Path .\dist\* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepcool-digital-lite-windows-x64
          path: |
            deepcool-digital-lite-windows-x64.zip
            deepcool-digital-lite-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "deepcool-digital-lite-windows-x64.zip"
          $checksum = "$archive.sha256"

          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "SilentlyContinue"
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $savedErrorActionPreference

          if ($releaseExists) {
            gh release upload $tag $archive $checksum --clobber
          } else {
            gh release create $tag $archive $checksum --verify-tag --generate-notes --title "DeepCool Digital Lite $tag"
          }
